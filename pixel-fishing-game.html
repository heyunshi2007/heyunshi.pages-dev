<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素捕鱼达人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border: 4px solid #ffd700;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    image-rendering: pixelated;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .ui-panel {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #ffd700;
    padding: 8px 16px;
    color: #ffd700;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    border-radius: 4px;
  }
  #startScreen, #gameOverScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 20, 0.85);
    z-index: 20;
    color: #ffd700;
    text-align: center;
  }
  #startScreen h1, #gameOverScreen h1 {
    font-size: 36px;
    text-shadow: 3px 3px 0 #000;
    margin-bottom: 20px;
  }
  #startScreen p, #gameOverScreen p {
    font-size: 16px;
    color: #aaccff;
    margin-bottom: 10px;
    text-shadow: 1px 1px 0 #000;
  }
  .btn {
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 20px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    background: #ffd700;
    color: #0a0a2e;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    text-shadow: none;
    pointer-events: all;
    transition: transform 0.1s;
  }
  .btn:hover { transform: scale(1.1); }
  .btn:active { transform: scale(0.95); }
  #levelUp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff4444;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 3px 3px 0 #000;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #helpText {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    pointer-events: none;
    z-index: 10;
    text-shadow: 1px 1px 0 #000;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="ui">
    <div class="ui-panel">💰 金币: <span id="coins">100</span></div>
    <div class="ui-panel">🏆 分数: <span id="score">0</span></div>
    <div class="ui-panel">🔫 炮台: Lv.<span id="cannonLevel">1</span></div>
  </div>
  <div id="levelUp">炮台升级!</div>
  <div id="helpText">鼠标点击射击 | 滚轮/数字键切换炮台等级 | 空格键发射渔网炸弹</div>

  <div id="startScreen">
    <h1>🐟 像素捕鱼达人 🐟</h1>
    <p>在深海中捕获各种鱼类，赚取金币！</p>
    <p>🖱️ 鼠标点击 = 射击</p>
    <p>⚙️ 滚轮/数字键 = 切换炮台等级</p>
    <p>💣 空格键 = 渔网炸弹（范围攻击）</p>
    <p style="color:#ffd700; margin-top:15px;">炮台等级越高，威力越大，消耗金币越多！</p>
    <button class="btn" onclick="startGame()">开始游戏</button>
  </div>

  <div id="gameOverScreen" style="display:none;">
    <h1>游戏结束</h1>
    <p>最终分数: <span id="finalScore">0</span></p>
    <p>捕获金币: <span id="finalCoins">0</span></p>
    <button class="btn" onclick="startGame()">再来一局</button>
  </div>
</div>

<script>
// ============ 游戏配置 ============
const CONFIG = {
  WIDTH: 800,
  HEIGHT: 600,
  BG_COLOR_TOP: '#0a1628',
  BG_COLOR_BOT: '#0d2847',
  SAND_COLOR: '#c2a060',
  CANNON_X: 400,
  CANNON_Y: 570,
  MAX_BULLETS: 30,
  FISH_SPAWN_INTERVAL: 800,
  MAX_FISH: 25,
  BUBBLE_COUNT: 15,
};

// 炮台等级配置
const CANNON_LEVELS = [
  { level: 1, cost: 2,  power: 1, speed: 8,  color: '#888888', size: 1 },
  { level: 2, cost: 5,  power: 2, speed: 9,  color: '#44aa44', size: 1.2 },
  { level: 3, cost: 10, power: 4, speed: 10, color: '#4488ff', size: 1.4 },
  { level: 4, cost: 20, power: 8, speed: 11, color: '#aa44ff', size: 1.6 },
  { level: 5, cost: 50, power: 15, speed: 12, color: '#ff4444', size: 1.8 },
  { level: 6, cost: 100, power: 30, speed: 13, color: '#ffd700', size: 2.0 },
  { level: 7, cost: 200, power: 50, speed: 14, color: '#ff6600', size: 2.2 },
];

// 鱼类配置
const FISH_TYPES = [
  { name: '小丑鱼', hp: 2,  reward: 5,   speed: [1.5, 2.5], size: 20, color1: '#ff6633', color2: '#ffffff', freq: 0.35 },
  { name: '蓝鱼',   hp: 5,  reward: 12,  speed: [1.2, 2.2], size: 26, color1: '#3388ff', color2: '#66bbff', freq: 0.25 },
  { name: '绿鱼',   hp: 10, reward: 25,  speed: [1.0, 2.0], size: 32, color1: '#33cc66', color2: '#88ff99', freq: 0.18 },
  { name: '河豚',   hp: 20, reward: 50,  speed: [0.8, 1.5], size: 36, color1: '#ffcc33', color2: '#ffee88', freq: 0.10 },
  { name: '鲨鱼',   hp: 50, reward: 120, speed: [1.0, 1.8], size: 50, color1: '#667788', color2: '#99aabb', freq: 0.07 },
  { name: '金龙鱼', hp: 100, reward: 300, speed: [0.6, 1.2], size: 55, color1: '#ffd700', color2: '#ffee66', freq: 0.03 },
  { name: '海龟',   hp: 30, reward: 80,  speed: [0.5, 1.0], size: 40, color1: '#338855', color2: '#66bb88', freq: 0.05 },
  { name: '灯笼鱼', hp: 8,  reward: 18,  speed: [1.3, 2.3], size: 24, color1: '#9944cc', color2: '#cc88ff', freq: 0.12 },
];

// ============ 游戏状态 ============
let canvas, ctx;
let gameState = 'start'; // start, playing, gameover
let coins = 100;
let score = 0;
let cannonLevel = 0;
let cannonAngle = -Math.PI / 2;
let mouseX = 400, mouseY = 300;
let bullets = [];
let fishes = [];
let nets = [];
let particles = [];
let bubbles = [];
let floatingTexts = [];
let seaweeds = [];
let lastFishSpawn = 0;
let netBombCooldown = 0;
let frameCount = 0;
let waveOffset = 0;

// ============ 初始化 ============
function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 生成海草
  seaweeds = [];
  for (let i = 0; i < 12; i++) {
    seaweeds.push({
      x: 40 + Math.random() * 720,
      height: 40 + Math.random() * 80,
      phase: Math.random() * Math.PI * 2,
      color: `hsl(${120 + Math.random() * 40}, ${60 + Math.random() * 20}%, ${25 + Math.random() * 15}%)`
    });
  }

  // 生成气泡
  bubbles = [];
  for (let i = 0; i < CONFIG.BUBBLE_COUNT; i++) {
    bubbles.push(createBubble());
  }

  // 事件监听
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onShoot);
  canvas.addEventListener('wheel', onWheel);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', onKeyDown);

  requestAnimationFrame(gameLoop);
}

function createBubble() {
  return {
    x: Math.random() * CONFIG.WIDTH,
    y: CONFIG.HEIGHT - 30 + Math.random() * 30,
    size: 2 + Math.random() * 5,
    speed: 0.3 + Math.random() * 0.8,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.03,
  };
}

// ============ 游戏循环 ============
function gameLoop(timestamp) {
  if (gameState === 'playing') {
    update(timestamp);
  }
  render();
  requestAnimationFrame(gameLoop);
}

function update(timestamp) {
  frameCount++;
  waveOffset += 0.02;

  // 生成鱼
  if (timestamp - lastFishSpawn > CONFIG.FISH_SPAWN_INTERVAL && fishes.length < CONFIG.MAX_FISH) {
    spawnFish();
    lastFishSpawn = timestamp;
  }

  // 更新鱼
  for (let i = fishes.length - 1; i >= 0; i--) {
    let f = fishes[i];
    f.x += f.vx;
    f.y += Math.sin(frameCount * f.wobbleSpeed + f.wobblePhase) * f.wobbleAmp;
    f.animFrame = (f.animFrame + 0.1) % 2;

    // 移出屏幕
    if (f.x < -80 || f.x > CONFIG.WIDTH + 80) {
      fishes.splice(i, 1);
    }
  }

  // 更新子弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    if (b.x < -20 || b.x > CONFIG.WIDTH + 20 || b.y < -20 || b.y > CONFIG.HEIGHT + 20 || b.life <= 0) {
      bullets.splice(i, 1);
      continue;
    }

    // 碰撞检测
    for (let j = fishes.length - 1; j >= 0; j--) {
      let f = fishes[j];
      let dx = b.x - f.x;
      let dy = b.y - f.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < f.size * 0.6) {
        f.hp -= b.power;
        // 击中粒子
        spawnHitParticles(b.x, b.y, f.color1);
        bullets.splice(i, 1);

        if (f.hp <= 0) {
          // 捕获成功
          coins += f.reward;
          score += f.reward;
          spawnCaptureEffect(f.x, f.y, f.reward);
          spawnCoinParticles(f.x, f.y, f.color1);
          fishes.splice(j, 1);
          updateUI();
        }
        break;
      }
    }
  }

  // 更新渔网
  for (let i = nets.length - 1; i >= 0; i--) {
    let n = nets[i];
    n.life--;
    n.radius += 1.5;
    n.alpha -= 0.015;

    if (n.life <= 0 || n.alpha <= 0) {
      nets.splice(i, 1);
      continue;
    }

    // 范围伤害
    for (let j = fishes.length - 1; j >= 0; j--) {
      let f = fishes[j];
      let dx = n.x - f.x;
      let dy = n.y - f.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < n.radius && !n.hitFishes.has(j)) {
        n.hitFishes.add(j);
        f.hp -= n.power;
        spawnHitParticles(f.x, f.y, f.color1);

        if (f.hp <= 0) {
          coins += f.reward;
          score += f.reward;
          spawnCaptureEffect(f.x, f.y, f.reward);
          spawnCoinParticles(f.x, f.y, f.color1);
          fishes.splice(j, 1);
          updateUI();
        }
      }
    }
  }

  // 更新粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity || 0;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 更新浮动文字
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let t = floatingTexts[i];
    t.y -= 1.5;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }

  // 更新气泡
  for (let b of bubbles) {
    b.y -= b.speed;
    b.wobble += b.wobbleSpeed;
    b.x += Math.sin(b.wobble) * 0.3;
    if (b.y < -10) {
      Object.assign(b, createBubble());
    }
  }

  // 炮台冷却
  if (netBombCooldown > 0) netBombCooldown--;

  // 游戏结束判定
  if (coins <= 0 && bullets.length === 0 && nets.length === 0) {
    gameState = 'gameover';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalCoins').textContent = score;
    document.getElementById('gameOverScreen').style.display = 'flex';
  }
}

// ============ 渲染 ============
function render() {
  // 背景
  drawBackground();

  // 海草
  drawSeaweeds();

  // 气泡
  drawBubbles();

  // 鱼
  for (let f of fishes) {
    drawFish(f);
  }

  // 子弹
  for (let b of bullets) {
    drawBullet(b);
  }

  // 渔网
  for (let n of nets) {
    drawNet(n);
  }

  // 粒子
  for (let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x - p.size/2), Math.floor(p.y - p.size/2), p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 浮动文字
  for (let t of floatingTexts) {
    ctx.globalAlpha = t.life / t.maxLife;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.fontSize}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(t.text, Math.floor(t.x), Math.floor(t.y));
  }
  ctx.globalAlpha = 1;

  // 炮台
  if (gameState === 'playing') {
    drawCannon();
  }

  // 沙地
  drawSand();
}

function drawBackground() {
  // 深海渐变
  let grd = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT);
  grd.addColorStop(0, '#061224');
  grd.addColorStop(0.3, '#0a1e3d');
  grd.addColorStop(0.7, '#0d2847');
  grd.addColorStop(1, '#102a4a');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  // 水面波纹
  ctx.fillStyle = 'rgba(100, 180, 255, 0.08)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= CONFIG.WIDTH; x += 4) {
      let y = 8 + i * 6 + Math.sin(x * 0.02 + waveOffset + i) * 3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(CONFIG.WIDTH, 0);
    ctx.fill();
  }

  // 光线效果
  ctx.save();
  for (let i = 0; i < 5; i++) {
    let lx = 100 + i * 160 + Math.sin(waveOffset * 0.5 + i) * 20;
    ctx.fillStyle = `rgba(100, 200, 255, ${0.02 + Math.sin(waveOffset + i) * 0.01})`;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx - 30, CONFIG.HEIGHT);
    ctx.lineTo(lx + 30, CONFIG.HEIGHT);
    ctx.fill();
  }
  ctx.restore();
}

function drawSeaweeds() {
  for (let sw of seaweeds) {
    ctx.fillStyle = sw.color;
    let segments = Math.floor(sw.height / 6);
    for (let s = 0; s < segments; s++) {
      let sway = Math.sin(frameCount * 0.03 + sw.phase + s * 0.3) * (s * 0.8);
      let sx = Math.floor(sw.x + sway);
      let sy = CONFIG.HEIGHT - 25 - s * 6;
      ctx.fillRect(sx - 2, sy, 4, 6);
    }
  }
}

function drawBubbles() {
  for (let b of bubbles) {
    ctx.strokeStyle = 'rgba(150, 200, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(Math.floor(b.x), Math.floor(b.y), b.size, 0, Math.PI * 2);
    ctx.stroke();
    // 高光
    ctx.fillStyle = 'rgba(200, 230, 255, 0.2)';
    ctx.fillRect(Math.floor(b.x - b.size * 0.3), Math.floor(b.y - b.size * 0.3), 2, 2);
  }
}

function drawSand() {
  // 沙地
  ctx.fillStyle = CONFIG.SAND_COLOR;
  ctx.fillRect(0, CONFIG.HEIGHT - 25, CONFIG.WIDTH, 25);
  // 沙地纹理
  ctx.fillStyle = '#b89550';
  for (let x = 0; x < CONFIG.WIDTH; x += 8) {
    let h = 2 + Math.sin(x * 0.1) * 2;
    ctx.fillRect(x, CONFIG.HEIGHT - 25 - h, 4, h);
  }
  ctx.fillStyle = '#d4b070';
  for (let x = 3; x < CONFIG.WIDTH; x += 12) {
    ctx.fillRect(x, CONFIG.HEIGHT - 22, 2, 2);
  }
}

// ============ 像素绘制：鱼类 ============
function drawFish(f) {
  ctx.save();
  ctx.translate(Math.floor(f.x), Math.floor(f.y));
  if (f.vx < 0) ctx.scale(-1, 1);

  let s = f.size;
  let c1 = f.color1;
  let c2 = f.color2;
  let tailWag = Math.sin(frameCount * 0.2 + f.wobblePhase) * 2;

  // 特殊鱼绘制
  if (f.type === 3) {
    // 河豚 - 圆形
    drawPufferfish(s, c1, c2, tailWag);
  } else if (f.type === 4) {
    // 鲨鱼
    drawShark(s, c1, c2, tailWag);
  } else if (f.type === 5) {
    // 金龙鱼
    drawDragonFish(s, c1, c2, tailWag);
  } else if (f.type === 6) {
    // 海龟
    drawTurtle(s, c1, c2, tailWag);
  } else if (f.type === 7) {
    // 灯笼鱼
    drawLanternFish(s, c1, c2, tailWag);
  } else {
    // 普通鱼
    drawNormalFish(s, c1, c2, tailWag);
  }

  // 血条
  if (f.hp < f.maxHp) {
    let barW = s * 1.2;
    let barH = 4;
    let hpRatio = f.hp / f.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(-barW/2, -s * 0.5 - 8, barW, barH);
    ctx.fillStyle = hpRatio > 0.5 ? '#44ff44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
    ctx.fillRect(-barW/2, -s * 0.5 - 8, barW * hpRatio, barH);
  }

  ctx.restore();
}

function drawNormalFish(s, c1, c2, tw) {
  // 身体
  ctx.fillStyle = c1;
  fillPixelEllipse(0, 0, s * 0.5, s * 0.3);
  // 尾巴
  ctx.fillStyle = c2;
  fillPixelTriangle(-s * 0.4, 0, -s * 0.7, -s * 0.25 + tw, -s * 0.7, s * 0.25 + tw);
  // 背鳍
  ctx.fillStyle = c1;
  fillPixelTriangle(s * 0.05, -s * 0.28, -s * 0.15, -s * 0.45, s * 0.2, -s * 0.28);
  // 眼睛
  ctx.fillStyle = '#fff';
  fillPixelRect(s * 0.2, -s * 0.08, 5, 5);
  ctx.fillStyle = '#000';
  fillPixelRect(s * 0.22, -s * 0.06, 3, 3);
  // 条纹
  ctx.fillStyle = c2;
  fillPixelRect(s * 0.05, -s * 0.15, 3, s * 0.3);
  fillPixelRect(-s * 0.1, -s * 0.12, 3, s * 0.24);
}

function drawPufferfish(s, c1, c2, tw) {
  // 圆形身体
  ctx.fillStyle = c1;
  fillPixelCircle(0, 0, s * 0.4);
  // 刺
  ctx.fillStyle = c2;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
    let sx = Math.cos(a) * s * 0.45;
    let sy = Math.sin(a) * s * 0.45;
    fillPixelRect(sx - 1, sy - 1, 3, 3);
  }
  // 尾巴
  ctx.fillStyle = c1;
  fillPixelTriangle(-s * 0.35, 0, -s * 0.55, -s * 0.15 + tw, -s * 0.55, s * 0.15 + tw);
  // 眼睛
  ctx.fillStyle = '#fff';
  fillPixelRect(s * 0.15, -s * 0.12, 6, 6);
  ctx.fillStyle = '#000';
  fillPixelRect(s * 0.18, -s * 0.1, 3, 3);
  // 嘴
  ctx.fillStyle = '#cc8833';
  fillPixelRect(s * 0.35, -s * 0.02, 4, 4);
}

function drawShark(s, c1, c2, tw) {
  // 身体 - 流线型
  ctx.fillStyle = c1;
  fillPixelEllipse(0, 0, s * 0.55, s * 0.22);
  // 腹部
  ctx.fillStyle = c2;
  fillPixelEllipse(s * 0.05, s * 0.08, s * 0.4, s * 0.1);
  // 背鳍 - 三角形
  ctx.fillStyle = c1;
  fillPixelTriangle(0, -s * 0.2, -s * 0.1, -s * 0.45, s * 0.1, -s * 0.2);
  // 尾巴
  ctx.fillStyle = c1;
  fillPixelTriangle(-s * 0.45, 0, -s * 0.75, -s * 0.3 + tw, -s * 0.65, s * 0.05 + tw);
  // 眼睛
  ctx.fillStyle = '#fff';
  fillPixelRect(s * 0.3, -s * 0.1, 5, 5);
  ctx.fillStyle = '#000';
  fillPixelRect(s * 0.32, -s * 0.08, 3, 3);
  // 牙齿
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) {
    fillPixelRect(s * 0.45 + i * 3, s * 0.02, 2, 3);
  }
}

function drawDragonFish(s, c1, c2, tw) {
  // 金色身体
  ctx.fillStyle = c1;
  fillPixelEllipse(0, 0, s * 0.5, s * 0.25);
  // 鳞片效果
  ctx.fillStyle = c2;
  for (let i = -3; i <= 2; i++) {
    for (let j = -1; j <= 1; j++) {
      fillPixelRect(i * 7, j * 7, 4, 4);
    }
  }
  // 华丽尾巴
  ctx.fillStyle = c1;
  fillPixelTriangle(-s * 0.4, 0, -s * 0.8, -s * 0.35 + tw, -s * 0.75, s * 0.2 + tw);
  ctx.fillStyle = c2;
  fillPixelTriangle(-s * 0.4, 0, -s * 0.7, -s * 0.15 + tw, -s * 0.8, s * 0.1 + tw);
  // 皇冠/龙角
  ctx.fillStyle = '#ff4400';
  fillPixelRect(s * 0.1, -s * 0.3, 3, 8);
  fillPixelRect(s * 0.2, -s * 0.35, 3, 10);
  fillPixelRect(-s * 0.05, -s * 0.28, 3, 7);
  // 眼睛
  ctx.fillStyle = '#ff0000';
  fillPixelRect(s * 0.25, -s * 0.08, 6, 6);
  ctx.fillStyle = '#ffff00';
  fillPixelRect(s * 0.27, -s * 0.06, 3, 3);
  // 发光效果
  ctx.fillStyle = `rgba(255, 215, 0, ${0.1 + Math.sin(frameCount * 0.1) * 0.05})`;
  fillPixelCircle(0, 0, s * 0.6);
}

function drawTurtle(s, c1, c2, tw) {
  // 壳
  ctx.fillStyle = '#556633';
  fillPixelEllipse(0, 0, s * 0.4, s * 0.3);
  // 壳纹
  ctx.fillStyle = c1;
  fillPixelEllipse(0, 0, s * 0.3, s * 0.22);
  ctx.fillStyle = c2;
  fillPixelRect(-s * 0.1, -s * 0.05, 5, 5);
  fillPixelRect(s * 0.05, -s * 0.05, 5, 5);
  fillPixelRect(-s * 0.02, s * 0.05, 5, 5);
  // 头
  ctx.fillStyle = c1;
  fillPixelRect(s * 0.35, -s * 0.08, 10, 10);
  // 眼睛
  ctx.fillStyle = '#000';
  fillPixelRect(s * 0.42, -s * 0.06, 2, 2);
  // 鳍
  let flipperAngle = Math.sin(frameCount * 0.1) * 0.2;
  ctx.fillStyle = c1;
  fillPixelRect(s * 0.1, -s * 0.32, 12, 5);
  fillPixelRect(s * 0.1, s * 0.27, 12, 5);
  fillPixelRect(-s * 0.25, -s * 0.28, 10, 5);
  fillPixelRect(-s * 0.25, s * 0.23, 10, 5);
  // 尾巴
  fillPixelTriangle(-s * 0.38, 0, -s * 0.5, -s * 0.05 + tw, -s * 0.5, s * 0.05 + tw);
}

function drawLanternFish(s, c1, c2, tw) {
  // 身体
  ctx.fillStyle = c1;
  fillPixelEllipse(0, 0, s * 0.4, s * 0.25);
  // 灯笼
  let glowAlpha = 0.5 + Math.sin(frameCount * 0.15) * 0.3;
  ctx.fillStyle = `rgba(255, 255, 100, ${glowAlpha})`;
  fillPixelCircle(s * 0.45, -s * 0.3, 5);
  ctx.fillStyle = '#ffff66';
  fillPixelCircle(s * 0.45, -s * 0.3, 3);
  // 灯杆
  ctx.fillStyle = c2;
  fillPixelRect(s * 0.25, -s * 0.25, 2, s * 0.15);
  // 尾巴
  ctx.fillStyle = c1;
  fillPixelTriangle(-s * 0.35, 0, -s * 0.55, -s * 0.2 + tw, -s * 0.55, s * 0.2 + tw);
  // 眼睛
  ctx.fillStyle = '#ffff00';
  fillPixelRect(s * 0.2, -s * 0.08, 5, 5);
  ctx.fillStyle = '#000';
  fillPixelRect(s * 0.22, -s * 0.06, 2, 2);
}

// ============ 像素绘制：炮台 ============
function drawCannon() {
  let lv = CANNON_LEVELS[cannonLevel];
  let cx = CONFIG.CANNON_X;
  let cy = CONFIG.CANNON_Y;

  ctx.save();
  ctx.translate(cx, cy);

  // 底座
  ctx.fillStyle = '#555555';
  fillPixelRect(-25, -5, 50, 15);
  ctx.fillStyle = '#666666';
  fillPixelRect(-20, -8, 40, 8);
  ctx.fillStyle = '#777777';
  fillPixelRect(-15, -10, 30, 5);

  // 炮管
  ctx.save();
  ctx.rotate(cannonAngle + Math.PI / 2);

  let barrelLen = 35 * lv.size;
  let barrelW = 8 * lv.size;

  // 炮管阴影
  ctx.fillStyle = '#444';
  fillPixelRect(-barrelW/2 - 1, -barrelLen, barrelW + 2, barrelLen + 2);

  // 炮管主体
  ctx.fillStyle = lv.color;
  fillPixelRect(-barrelW/2, -barrelLen, barrelW, barrelLen);

  // 炮管高光
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.2;
  fillPixelRect(-barrelW/4, -barrelLen, barrelW/3, barrelLen);
  ctx.globalAlpha = 1;

  // 炮口
  ctx.fillStyle = '#333';
  fillPixelRect(-barrelW/2 - 2, -barrelLen - 3, barrelW + 4, 5);

  // 炮管装饰环
  ctx.fillStyle = '#ffd700';
  fillPixelRect(-barrelW/2 - 1, -barrelLen * 0.3, barrelW + 2, 3);
  fillPixelRect(-barrelW/2 - 1, -barrelLen * 0.6, barrelW + 2, 3);

  ctx.restore();

  // 等级标识
  ctx.fillStyle = lv.color;
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('Lv' + lv.level, 0, 18);

  ctx.restore();
}

// ============ 像素绘制：子弹 ============
function drawBullet(b) {
  ctx.save();
  ctx.translate(Math.floor(b.x), Math.floor(b.y));
  let angle = Math.atan2(b.vy, b.vx);
  ctx.rotate(angle);

  let lv = CANNON_LEVELS[b.level];
  let s = 4 * lv.size;

  // 子弹主体
  ctx.fillStyle = lv.color;
  fillPixelRect(-s, -s/2, s * 2, s);

  // 子弹尾焰
  ctx.fillStyle = '#ff8800';
  fillPixelRect(-s * 2.5, -s/3, s * 1.5, s * 0.66);
  ctx.fillStyle = '#ffcc00';
  fillPixelRect(-s * 1.8, -s/4, s, s * 0.5);

  ctx.restore();
}

// ============ 像素绘制：渔网 ============
function drawNet(n) {
  ctx.save();
  ctx.globalAlpha = n.alpha;
  ctx.strokeStyle = '#88ccff';
  ctx.lineWidth = 2;

  // 网格线
  let r = n.radius;
  let step = 12;
  ctx.beginPath();
  // 同心方格
  for (let i = step; i < r; i += step) {
    ctx.rect(Math.floor(n.x - i), Math.floor(n.y - i), i * 2, i * 2);
  }
  ctx.stroke();

  // 外圈
  ctx.strokeStyle = '#aaddff';
  ctx.beginPath();
  ctx.arc(Math.floor(n.x), Math.floor(n.y), r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

// ============ 像素辅助绘制 ============
function fillPixelRect(x, y, w, h) {
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function fillPixelCircle(cx, cy, r) {
  r = Math.floor(r);
  cx = Math.floor(cx);
  cy = Math.floor(cy);
  for (let y = -r; y <= r; y++) {
    for (let x = -r; x <= r; x++) {
      if (x * x + y * y <= r * r) {
        ctx.fillRect(cx + x, cy + y, 1, 1);
      }
    }
  }
}

function fillPixelEllipse(cx, cy, rx, ry) {
  rx = Math.floor(rx);
  ry = Math.floor(ry);
  cx = Math.floor(cx);
  cy = Math.floor(cy);
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        ctx.fillRect(cx + x, cy + y, 1, 1);
      }
    }
  }
}

function fillPixelTriangle(x1, y1, x2, y2, x3, y3) {
  x1 = Math.floor(x1); y1 = Math.floor(y1);
  x2 = Math.floor(x2); y2 = Math.floor(y2);
  x3 = Math.floor(x3); y3 = Math.floor(y3);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.closePath();
  ctx.fill();
}

// ============ 游戏逻辑 ============
function spawnFish() {
  // 根据频率选择鱼类型
  let rand = Math.random();
  let cumulative = 0;
  let typeIndex = 0;
  for (let i = 0; i < FISH_TYPES.length; i++) {
    cumulative += FISH_TYPES[i].freq;
    if (rand < cumulative) {
      typeIndex = i;
      break;
    }
  }

  let ft = FISH_TYPES[typeIndex];
  let fromLeft = Math.random() > 0.5;
  let speed = ft.speed[0] + Math.random() * (ft.speed[1] - ft.speed[0]);

  let fish = {
    type: typeIndex,
    name: ft.name,
    x: fromLeft ? -ft.size : CONFIG.WIDTH + ft.size,
    y: 40 + Math.random() * (CONFIG.HEIGHT - 100),
    vx: fromLeft ? speed : -speed,
    size: ft.size,
    hp: ft.hp,
    maxHp: ft.hp,
    reward: ft.reward,
    color1: ft.color1,
    color2: ft.color2,
    wobbleSpeed: 0.03 + Math.random() * 0.03,
    wobbleAmp: 0.5 + Math.random() * 1.5,
    wobblePhase: Math.random() * Math.PI * 2,
    animFrame: 0,
  };

  fishes.push(fish);
}

function shoot(targetX, targetY) {
  let lv = CANNON_LEVELS[cannonLevel];
  if (coins < lv.cost) return;
  if (bullets.length >= CONFIG.MAX_BULLETS) return;

  coins -= lv.cost;
  updateUI();

  let dx = targetX - CONFIG.CANNON_X;
  let dy = targetY - CONFIG.CANNON_Y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  let vx = (dx / dist) * lv.speed;
  let vy = (dy / dist) * lv.speed;

  bullets.push({
    x: CONFIG.CANNON_X,
    y: CONFIG.CANNON_Y - 15,
    vx, vy,
    power: lv.power,
    level: cannonLevel,
    life: 120,
  });
}

function fireNetBomb() {
  let lv = CANNON_LEVELS[cannonLevel];
  let cost = lv.cost * 5;
  if (coins < cost || netBombCooldown > 0) return;

  coins -= cost;
  netBombCooldown = 60;
  updateUI();

  // 在炮台前方释放渔网
  let dist = 100;
  let nx = CONFIG.CANNON_X + Math.cos(cannonAngle + Math.PI / 2) * dist * -1;
  let ny = CONFIG.CANNON_Y + Math.sin(cannonAngle + Math.PI / 2) * dist * -1;

  // 修正方向
  let dx = mouseX - CONFIG.CANNON_X;
  let dy = mouseY - CONFIG.CANNON_Y;
  let d = Math.sqrt(dx * dx + dy * dy);
  nx = CONFIG.CANNON_X + (dx / d) * 80;
  ny = CONFIG.CANNON_Y + (dy / d) * 80;

  nets.push({
    x: nx, y: ny,
    radius: 10,
    power: lv.power * 2,
    life: 40,
    alpha: 0.8,
    hitFishes: new Set(),
  });
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3,
      color: color,
      life: 15 + Math.random() * 10,
      maxLife: 25,
      gravity: 0.05,
    });
  }
}

function spawnCaptureEffect(x, y, reward) {
  // 金币粒子
  for (let i = 0; i < 8; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 3 + Math.random() * 3,
      color: '#ffd700',
      life: 30 + Math.random() * 20,
      maxLife: 50,
      gravity: 0.1,
    });
  }

  // 浮动文字
  floatingTexts.push({
    x, y: y - 10,
    text: '+' + reward,
    color: '#ffd700',
    fontSize: 18,
    life: 50,
    maxLife: 50,
  });
}

function spawnCoinParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 2,
      vy: -1 - Math.random() * 2,
      size: 2,
      color: color,
      life: 20,
      maxLife: 20,
      gravity: 0.05,
    });
  }
}

// ============ UI 更新 ============
function updateUI() {
  document.getElementById('coins').textContent = coins;
  document.getElementById('score').textContent = score;
  document.getElementById('cannonLevel').textContent = CANNON_LEVELS[cannonLevel].level;
}

// ============ 事件处理 ============
function onMouseMove(e) {
  let rect = canvas.getBoundingClientRect();
  let scaleX = CONFIG.WIDTH / rect.width;
  let scaleY = CONFIG.HEIGHT / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;

  // 更新炮台角度
  let dx = mouseX - CONFIG.CANNON_X;
  let dy = mouseY - CONFIG.CANNON_Y;
  cannonAngle = Math.atan2(dy, dx) - Math.PI / 2;

  // 限制角度范围
  if (cannonAngle > 0.3) cannonAngle = 0.3;
  if (cannonAngle < -Math.PI - 0.3) cannonAngle = -Math.PI - 0.3;
}

function onShoot(e) {
  if (gameState !== 'playing') return;
  let rect = canvas.getBoundingClientRect();
  let scaleX = CONFIG.WIDTH / rect.width;
  let scaleY = CONFIG.HEIGHT / rect.height;
  let tx = (e.clientX - rect.left) * scaleX;
  let ty = (e.clientY - rect.top) * scaleY;
  shoot(tx, ty);
}

function onWheel(e) {
  if (gameState !== 'playing') return;
  e.preventDefault();
  if (e.deltaY < 0) {
    cannonLevel = Math.min(cannonLevel + 1, CANNON_LEVELS.length - 1);
  } else {
    cannonLevel = Math.max(cannonLevel - 1, 0);
  }
  updateUI();
  showLevelUp();
}

function onKeyDown(e) {
  if (gameState !== 'playing') return;

  // 数字键切换炮台等级
  if (e.key >= '1' && e.key <= '7') {
    cannonLevel = parseInt(e.key) - 1;
    updateUI();
    showLevelUp();
  }

  // 空格键发射渔网炸弹
  if (e.key === ' ') {
    e.preventDefault();
    fireNetBomb();
  }
}

function showLevelUp() {
  let el = document.getElementById('levelUp');
  el.textContent = `炮台 Lv.${CANNON_LEVELS[cannonLevel].level} | 消耗: ${CANNON_LEVELS[cannonLevel].cost}💰`;
  el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = 0; }, 1000);
}

// ============ 游戏控制 ============
function startGame() {
  gameState = 'playing';
  coins = 100;
  score = 0;
  cannonLevel = 0;
  bullets = [];
  fishes = [];
  nets = [];
  particles = [];
  floatingTexts = [];
  netBombCooldown = 0;
  frameCount = 0;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  updateUI();
}

// 启动
window.onload = init;
</script>
